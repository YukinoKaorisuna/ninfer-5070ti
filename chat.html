<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ninfer-serve 聊天测试</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --panel2: #1e222b;
    --border: #2a2f3a;
    --text: #e6e8ee;
    --muted: #8a93a6;
    --accent: #4f8cff;
    --accent2: #7c5cff;
    --user-bubble: #2b3f66;
    --assistant-bubble: #20242e;
    --reason-bg: #16181f;
    --ok: #3ddc84;
    --err: #ff5f6d;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    justify-content: center;
    font-size: 15px;
    line-height: 1.6;
  }
  .app {
    width: 100%;
    max-width: 880px;
    height: 100vh;
    display: flex;
    flex-direction: column;
    padding: 14px 16px;
    gap: 10px;
  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 4px 2px;
  }
  header .title { font-size: 17px; font-weight: 600; }
  header .status { display: flex; align-items: center; gap: 7px; color: var(--muted); font-size: 13px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #555; }
  .dot.on { background: var(--ok); box-shadow: 0 0 8px var(--ok); }
  .dot.off { background: var(--err); }
  .config {
    display: flex;
    gap: 8px;
    align-items: center;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 8px 10px;
    flex-wrap: wrap;
  }
  .config input { background: var(--panel2); border: 1px solid var(--border); color: var(--text); border-radius: 7px; padding: 7px 10px; font-size: 13px; }
  .config input.url { flex: 1; min-width: 220px; font-family: ui-monospace, Consolas, monospace; }
  .config input.tokens { width: 90px; }
  .config label { color: var(--muted); font-size: 12px; }
  .config .chk { display: flex; align-items: center; gap: 4px; cursor: pointer; user-select: none; white-space: nowrap; }
  .config .chk input { width: auto; }
  .config.sys { margin-top: -4px; }
  .config.sys .sysprompt { flex: 1; font-size: 12px; color: var(--text); }
  button {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 7px;
    padding: 8px 16px;
    font-size: 13px;
    cursor: pointer;
    font-weight: 600;
  }
  button:hover { filter: brightness(1.08); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  button.ghost { background: var(--panel2); color: var(--text); border: 1px solid var(--border); }
  .chat {
    flex: 1;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 14px;
    padding: 6px 2px;
  }
  .msg { display: flex; flex-direction: column; max-width: 92%; }
  .msg.user { align-self: flex-end; align-items: flex-end; }
  .msg.assistant { align-self: flex-start; align-items: flex-start; }
  .bubble {
    padding: 10px 14px;
    border-radius: 14px;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .msg.user .bubble { background: var(--user-bubble); border-bottom-right-radius: 4px; }
  .msg.assistant .bubble { background: var(--assistant-bubble); border-bottom-left-radius: 4px; border: 1px solid var(--border); }
  .reasoning {
    margin-top: 6px;
    background: var(--reason-bg);
    border: 1px dashed var(--border);
    border-radius: 10px;
    padding: 8px 12px;
    font-size: 13px;
    color: var(--muted);
  }
  .reasoning summary { cursor: pointer; font-size: 12px; color: var(--accent2); user-select: none; }
  .reasoning .rbody { white-space: pre-wrap; margin-top: 6px; }
  .meta { font-size: 11px; color: var(--muted); margin-top: 5px; }
  .cursor { display: inline-block; width: 7px; height: 15px; background: var(--accent); vertical-align: text-bottom; animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  footer {
    display: flex;
    gap: 8px;
    align-items: flex-end;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 10px;
  }
  footer textarea {
    flex: 1;
    background: transparent;
    border: none;
    color: var(--text);
    resize: none;
    font-size: 15px;
    font-family: inherit;
    outline: none;
    max-height: 160px;
    min-height: 40px;
  }
  .hint { color: var(--muted); font-size: 11px; text-align: center; padding-bottom: 2px; }
  .err-msg { color: var(--err); font-size: 13px; }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="title">ninfer-serve 聊天测试</div>
    <div class="status"><span class="dot" id="dot"></span><span id="statusText">未连接</span></div>
  </header>

  <div class="config">
    <input class="url" id="baseUrl" value="http://127.0.0.1:8100" spellcheck="false">
    <label>max tokens</label>
    <input class="tokens" id="maxTokens" type="number" value="512" min="16" max="8192">
    <label>温度</label>
    <input class="tokens" id="temperature" type="number" value="0.9" min="0" max="2" step="0.1">
    <label class="chk"><input type="checkbox" id="thinking" checked> 思考</label>
    <button id="clearBtn" class="ghost">清空</button>
  </div>
  <div class="config sys">
    <label>系统提示</label>
    <input class="sysprompt" id="sysPrompt" value="你是一位开放、直率的创作与讨论助手。写文学创作时，乐于塑造复杂、有张力、有冲突的人物和情节，敢于直面人性的灰色地带，不回避沉重或暧昧的题材。讨论争议性话题时，理性、就事论事、多角度分析，不套话、不空洞说教、不过度自我审查，但始终尊重事实与底线。">
  </div>

  <div class="chat" id="chat"></div>

  <footer>
    <textarea id="input" rows="1" placeholder="输入消息，Ctrl+Enter 发送"></textarea>
    <button id="sendBtn">发送</button>
  </footer>
  <div class="hint">模型 qwen3_8_27b · 上下文 65536 · KV q4 · MTP 投机解码</div>
</div>

<script>
const $ = id => document.getElementById(id);
const chat = $('chat');
const baseUrlInput = $('baseUrl');
const maxTokensInput = $('maxTokens');
const temperatureInput = $('temperature');
const input = $('input');
const sendBtn = $('sendBtn');
const dot = $('dot');
const statusText = $('statusText');

let history = [];
let streaming = false;

function baseUrl() { return baseUrlInput.value.replace(/\/+$/, ''); }
function setStatus(on, text) {
  dot.className = 'dot ' + (on ? 'on' : 'off');
  statusText.textContent = text;
}

async function ping() {
  try {
    const res = await fetch(baseUrl() + '/v1/models', { method: 'GET' });
    if (res.ok) setStatus(true, '已连接 ' + baseUrl());
    else setStatus(false, '服务异常 (' + res.status + ')');
  } catch (e) {
    setStatus(false, '未连接');
  }
}

function addBubble(role, text) {
  const wrap = document.createElement('div');
  wrap.className = 'msg ' + role;
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = text;
  wrap.appendChild(bubble);
  chat.appendChild(wrap);
  chat.scrollTop = chat.scrollHeight;
  return { wrap, bubble };
}

function addAssistant() {
  const wrap = document.createElement('div');
  wrap.className = 'msg assistant';
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  const cursor = document.createElement('span');
  cursor.className = 'cursor';
  bubble.appendChild(cursor);
  wrap.appendChild(bubble);
  chat.appendChild(wrap);
  chat.scrollTop = chat.scrollHeight;
  return { wrap, bubble, cursor };
}

function addReasoning(wrap, text) {
  let details = wrap.querySelector('details');
  if (!details) {
    details = document.createElement('details');
    details.className = 'reasoning';
    const summary = document.createElement('summary');
    summary.textContent = '思考过程';
    details.appendChild(summary);
    const body = document.createElement('div');
    body.className = 'rbody';
    details.appendChild(body);
    wrap.appendChild(details);
  }
  details.querySelector('.rbody').textContent = text;
  chat.scrollTop = chat.scrollHeight;
}

function addMeta(wrap, text) {
  const meta = document.createElement('div');
  meta.className = 'meta';
  meta.textContent = text;
  wrap.appendChild(meta);
  chat.scrollTop = chat.scrollHeight;
}

async function send() {
  const text = input.value.trim();
  if (!text || streaming) return;
  input.value = '';
  input.style.height = 'auto';

  const url = baseUrl() + '/v1/chat/completions';
  const sys = $('sysPrompt').value.trim();
  const msgs = [];
  if (sys) msgs.push({ role: 'system', content: sys });
  msgs.push(...history);
  msgs.push({ role: 'user', content: text });
  const body = {
    model: 'm',
    messages: msgs,
    max_tokens: parseInt(maxTokensInput.value) || 512,
    temperature: parseFloat(temperatureInput.value) || 0.7,
    enable_thinking: $('thinking').checked,
    stream: true
  };

  addBubble('user', text);
  history.push({ role: 'user', content: text });

  const { wrap, bubble, cursor } = addAssistant();
  let content = '';
  let reasoning = '';
  let finishReason = null;
  streaming = true;
  sendBtn.disabled = true;
  const t0 = performance.now();

  try {
    const res = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });

    if (!res.ok) {
      const err = await res.text();
      throw new Error('HTTP ' + res.status + ' ' + err);
    }

    const reader = res.body.getReader();
    const decoder = new TextDecoder('utf-8');
    let buffer = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });

      let idx;
      while ((idx = buffer.indexOf('\n')) >= 0) {
        const line = buffer.slice(0, idx).trim();
        buffer = buffer.slice(idx + 1);
        if (!line.startsWith('data:')) continue;
        const data = line.slice(5).trim();
        if (data === '[DONE]') { cursor.remove(); continue; }
        let chunk;
        try { chunk = JSON.parse(data); } catch (e) { continue; }
        const choice = chunk.choices && chunk.choices[0];
        if (choice && choice.delta) {
          if (choice.delta.content) { content += choice.delta.content; bubble.textContent = content; bubble.appendChild(cursor); }
          if (choice.delta.reasoning_content) { reasoning += choice.delta.reasoning_content; addReasoning(wrap, reasoning); }
        }
        if (choice && choice.finish_reason) finishReason = choice.finish_reason;
        if (chunk.usage) {
          const u = chunk.usage;
          addMeta(wrap, 'tokens: ' + (u.prompt_tokens || 0) + ' in / ' + (u.completion_tokens || 0) + ' out');
        }
        chat.scrollTop = chat.scrollHeight;
      }
    }
    cursor.remove();
    if (!content) bubble.textContent = '(空回复)';
    if (finishReason) addMeta(wrap, 'finish: ' + finishReason);
  } catch (e) {
    cursor.remove();
    bubble.innerHTML = '';
    const errSpan = document.createElement('span');
    errSpan.className = 'err-msg';
    errSpan.textContent = '错误: ' + e.message;
    bubble.appendChild(errSpan);
  } finally {
    const dt = ((performance.now() - t0) / 1000).toFixed(1);
    addMeta(wrap, '耗时 ' + dt + 's');
    streaming = false;
    sendBtn.disabled = false;
    input.focus();
    if (content) history.push({ role: 'assistant', content });
  }
}

function clearChat() {
  history = [];
  chat.innerHTML = '';
}

input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); send(); }
});
input.addEventListener('input', () => {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 160) + 'px';
});
sendBtn.addEventListener('click', send);
$('clearBtn').addEventListener('click', clearChat);
baseUrlInput.addEventListener('change', ping);

ping();
setInterval(ping, 15000);
</script>
</body>
</html>
